name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch Dockerfile for better-sqlite3
        run: |
          # Add python3-dev and pkg-config
          sed -i 's/apt-get install -y --no-install-recommends python3 make g++/apt-get install -y --no-install-recommends python3 python3-dev make g++ pkg-config/' Dockerfile
          
          # Copy build script into Docker context
          cp scripts/docker-build-better-sqlite3.sh ./docker-build-better-sqlite3.sh
          
          # Replace lines 58-61 in Dockerfile
          sed -i '58,61d' Dockerfile
          sed -i '57a\
  COPY docker-build-better-sqlite3.sh /app/docker-build-better-sqlite3.sh\
  RUN chmod +x /app/docker-build-better-sqlite3.sh && /app/docker-build-better-sqlite3.sh' Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image }}
          build-args: |
            AIRoute_BUILD_MEMORY_MB=6144
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
