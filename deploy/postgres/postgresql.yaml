# ──────────────────────────────────────────────────────────────────────
#  AIRoute — PostgreSQL StatefulSet for Multi-Replica Deployments
# ──────────────────────────────────────────────────────────────────────
#
#  用途:
#    - 当 AIRoute 需要多副本部署时, SQLite 单文件无法多写
#    - 设置 DB_TYPE=postgresql + DB_CONNECTION_STRING 切换到 PostgreSQL
#    - 适用于 ACK (阿里云) 和 CCE (华为云) 环境
#
#  生产建议:
#    - 小规模: 本文件 (自建 PG StatefulSet)
#    - 中大规模: 使用云厂商托管 RDS
#      - 阿里云: RDS PostgreSQL / PolarDB PostgreSQL
#      - 华为云: RDS PostgreSQL / GaussDB
# ──────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: airoute
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: airoute-gateway
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: airoute
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airoute
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airoute
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          - ReadWriteOnce
        # ACK 使用: alicloud-disk-ssd
        # CCE 使用: csi-disk
        # 请根据实际集群修改 storageClassName
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi

---
# ── Secret: PostgreSQL 凭据 ──
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: airoute
type: Opaque
stringData:
  username: "airoute"
  password: "CHANGE_ME_generate_with_openssl_rand_base64_24"

---
# ── Service: PostgreSQL ClusterIP ──
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: airoute
  labels:
    app: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app: postgresql
